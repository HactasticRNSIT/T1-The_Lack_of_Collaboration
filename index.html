<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KalaSetu – Preserving Heritage Through Innovation</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/framer-motion@10/dist/framer-motion.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
<style>
:root {
--gold: #c9a84c;
--deep: #0a0608;
--crimson: #8b1a1a;
--amber: #d4722a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #0a0608;
color: #f0e6d3;
font-family: 'Inter', sans-serif;
overflow-x: hidden;
cursor: none;
}

/* Custom cursor */
#cursor-glow {
position: fixed;
width: 400px;
height: 400px;
border-radius: 50%;
pointer-events: none;
z-index: 9999;
transform: translate(-50%, -50%);
background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
transition: opacity 0.3s;
}
#cursor-dot {
position: fixed;
width: 8px;
height: 8px;
border-radius: 50%;
pointer-events: none;
z-index: 10000;
transform: translate(-50%, -50%);
background: rgba(201,168,76,0.9);
box-shadow: 0 0 10px rgba(201,168,76,0.6), 0 0 20px rgba(201,168,76,0.3);
transition: transform 0.1s;
}

/* Noise texture */
body::before {
content: '';
position: fixed;
inset: 0;
background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg''%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
pointer-events: none;
z-index: 1;
opacity: 0.4;
}

/* Background images */
.bg-image {
position: absolute;
inset: 0;
background-size: cover;
background-position: center;
transition: opacity 1.5s cubic-bezier(0.4,0,0.2,1);
}

@keyframes kenBurns1 {
0% { transform: scale(1) translate(0,0); }
50% { transform: scale(1.08) translate(-1%, 1%); }
100% { transform: scale(1) translate(0,0); }
}
@keyframes kenBurns2 {
0% { transform: scale(1.05) translate(1%,-1%); }
50% { transform: scale(1) translate(-1%,1%); }
100% { transform: scale(1.05) translate(1%,-1%); }
}
@keyframes kenBurns3 {
0% { transform: scale(1) translate(0,0); }
50% { transform: scale(1.1) translate(1%,-1%); }
100% { transform: scale(1) translate(0,0); }
}

.ken-burns-1 { animation: kenBurns1 18s ease-in-out infinite; }
.ken-burns-2 { animation: kenBurns2 22s ease-in-out infinite; }
.ken-burns-3 { animation: kenBurns3 16s ease-in-out infinite; }

/* Glassmorphism */
.glass {
background: rgba(10, 6, 8, 0.4);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid rgba(201,168,76,0.15);
}
.glass-light {
background: rgba(255,255,255,0.04);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid rgba(255,255,255,0.08);
}

/* Glow text */
.glow-gold {
text-shadow: 0 0 40px rgba(201,168,76,0.6), 0 0 80px rgba(201,168,76,0.3);
}
.glow-text {
background: linear-gradient(135deg, #f5e6c8 0%, #c9a84c 40%, #f0d080 60%, #d4a853 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}

/* Floating orbs */
@keyframes float1 {
0%,100% { transform: translate(0,0) scale(1); }
33% { transform: translate(30px,-20px) scale(1.05); }
66% { transform: translate(-20px,15px) scale(0.95); }
}
@keyframes float2 {
0%,100% { transform: translate(0,0) scale(1); }
50% { transform: translate(-40px,25px) scale(1.08); }
}
@keyframes float3 {
0%,100% { transform: translate(0,0) rotate(0deg); }
50% { transform: translate(20px,-30px) rotate(180deg); }
}

.orb-1 { animation: float1 12s ease-in-out infinite; }
.orb-2 { animation: float2 16s ease-in-out infinite; }
.orb-3 { animation: float3 20s ease-in-out infinite; }

/* Scroll reveal */
.reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.4,0,0.2,1); }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: #0a0608; }
::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, #c9a84c, #8b1a1a); border-radius: 2px; }

/* Card hover */
.card-hover {
transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
}
.card-hover:hover {
transform: translateY(-6px) scale(1.02);
box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 30px rgba(201,168,76,0.1);
}

/* Progress bar */
@keyframes progressFill {
from { width: 0; }
to { width: var(--target-width); }
}

/* Light streak */
@keyframes streak {
0% { transform: translateX(-100%) rotate(15deg); opacity: 0; }
10% { opacity: 0.6; }
90% { opacity: 0.3; }
100% { transform: translateX(200vw) rotate(15deg); opacity: 0; }
}
.light-streak {
position: absolute;
height: 1px;
width: 200px;
background: linear-gradient(90deg, transparent, rgba(201,168,76,0.6), transparent);
animation: streak 6s ease-in-out infinite;
}

/* Collage */
.collage-container {
display: grid;
grid-template-columns: 1fr 1fr;
height: 100%;
overflow: hidden;
}
.collage-img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}

/* Particle */
@keyframes particle {
0% { transform: translateY(0) translateX(0); opacity: 0; }
10% { opacity: 1; }
90% { opacity: 0.5; }
100% { transform: translateY(-120vh) translateX(var(--drift)); opacity: 0; }
}

/* Mesh gradient animation */
@keyframes meshMove {
0%,100% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
}
.animated-mesh {
background: linear-gradient(-45deg, #1a0a05, #0d1a0a, #0a0a1a, #1a0a0a, #0a1015);
background-size: 400% 400%;
animation: meshMove 15s ease infinite;
}

/* Nav */
.nav-link {
position: relative;
transition: color 0.3s;
}
.nav-link::after {
content: '';
position: absolute;
bottom: -2px;
left: 0;
width: 0;
height: 1px;
background: linear-gradient(90deg, #c9a84c, transparent);
transition: width 0.3s;
}
.nav-link:hover::after { width: 100%; }
.nav-link:hover { color: #c9a84c; }

/* Badge */
.badge {
display: inline-flex;
align-items: center;
gap: 4px;
padding: 3px 10px;
border-radius: 999px;
font-size: 11px;
font-weight: 600;
letter-spacing: 0.05em;
text-transform: uppercase;
}

/* Section bg image bleed */
.section-img-bg {
position: absolute;
inset: 0;
background-size: cover;
background-position: center;
opacity: 0.08;
filter: blur(2px);
}

/* Contributor rank color */
.rank-1 { color: #ffd700; }
.rank-2 { color: #c0c0c0; }
.rank-3 { color: #cd7f32; }

/* Tooltip */
.tooltip {
position: relative;
}
.tooltip:hover .tooltip-text {
opacity: 1;
transform: translateY(0);
}
.tooltip-text {
position: absolute;
bottom: 110%;
left: 50%;
transform: translateX(-50%) translateY(4px);
background: rgba(10,6,8,0.95);
border: 1px solid rgba(201,168,76,0.3);
color: #f0e6d3;
font-size: 11px;
padding: 4px 10px;
border-radius: 6px;
white-space: nowrap;
opacity: 0;
transition: all 0.2s;
pointer-events: none;
}

/* Sparkle */
@keyframes sparkle {
0%,100% { opacity: 0; transform: scale(0); }
50% { opacity: 1; transform: scale(1); }
}

/* Tab active */
.tab-active {
background: linear-gradient(135deg, rgba(201,168,76,0.2), rgba(201,168,76,0.05));
border-color: rgba(201,168,76,0.5) !important;
color: #c9a84c;
}

@media (max-width: 768px) {
.collage-container { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="cursor-glow"></div>
<div id="cursor-dot"></div>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const { motion, AnimatePresence, useScroll, useTransform, useInView } = window.Motion;

// ─── IMAGE REGISTRY ───────────────────────────────────────────────────────────
// Using placeholder image URLs that represent the uploaded images
// In production these would be actual file paths/URLs
const IMAGES = {
templeCarving: "https://images.unsplash.com/photo-1609619385002-f40f1df9b7eb?w=1400&q=80",
manuscript: "https://images.unsplash.com/photo-1602837385569-08ac686be691?w=1400&q=80",
kathakali: "https://images.unsplash.com/photo-1621618572398-3cfa0d3f4d9a?w=1400&q=80",
tibetatScroll: "https://images.unsplash.com/photo-1544735716-392fe2489ffa?w=1400&q=80",
archaeology: "https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=1400&q=80",
gopuram: "https://images.unsplash.com/photo-1582510003544-4d00b7f74220?w=1400&q=80",
camera: "https://images.unsplash.com/photo-1520390138845-fd2d229dd553?w=1400&q=80",
};

// Override with actual uploaded image data URIs or blobs
// Since we can't embed the actual uploaded files in this code, we define placeholder keys
// The actual images from the uploads will be referenced via object URLs in production
const IMG = {
hero: IMAGES.kathakali,
carving: IMAGES.templeCarving,
ms: IMAGES.manuscript,
scroll: IMAGES.tibetatScroll,
dig: IMAGES.archaeology,
temple: IMAGES.gopuram,
cam: IMAGES.camera,
};

const ALL_IMAGES = Object.values(IMG);

// ─── CURSOR ───────────────────────────────────────────────────────────────────
function initCursor() {
const glow = document.getElementById('cursor-glow');
const dot = document.getElementById('cursor-dot');
let mx = 0, my = 0, gx = 0, gy = 0;
document.addEventListener('mousemove', e => {
mx = e.clientX; my = e.clientY;
dot.style.left = mx + 'px';
dot.style.top = my + 'px';
});
function animate() {
gx += (mx - gx) * 0.06;
gy += (my - gy) * 0.06;
glow.style.left = gx + 'px';
glow.style.top = gy + 'px';
requestAnimationFrame(animate);
}
animate();
}

// ─── PARTICLES ────────────────────────────────────────────────────────────────
function Particles() {
const particles = Array.from({length: 28}, (_, i) => ({
id: i,
x: Math.random() * 100,
delay: Math.random() * 8,
duration: 8 + Math.random() * 10,
size: 1 + Math.random() * 2,
drift: (Math.random() - 0.5) * 120,
opacity: 0.2 + Math.random() * 0.5,
}));

return (
<div className="absolute inset-0 overflow-hidden pointer-events-none">
{particles.map(p => (
<div
key={p.id}
style={{
position: 'absolute',
left: `${p.x}%`,
bottom: '-10px',
width: `${p.size}px`,
height: `${p.size}px`,
borderRadius: '50%',
background: `rgba(201,168,76,${p.opacity})`,
boxShadow: `0 0 ${p.size * 4}px rgba(201,168,76,0.4)`,
animation: `particle ${p.duration}s ${p.delay}s ease-in infinite`,
'--drift': `${p.drift}px`,
}}
/>
))}
</div>
);
}

// ─── FLOATING ORBS ────────────────────────────────────────────────────────────
function FloatingOrbs() {
return (
<div className="absolute inset-0 overflow-hidden pointer-events-none">
<div className="orb-1 absolute" style={{
top: '15%', left: '8%',
width: 320, height: 320,
borderRadius: '50%',
background: 'radial-gradient(circle, rgba(139,26,26,0.18) 0%, transparent 70%)',
filter: 'blur(40px)',
}}/>
<div className="orb-2 absolute" style={{
top: '55%', right: '6%',
width: 400, height: 400,
borderRadius: '50%',
background: 'radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%)',
filter: 'blur(50px)',
}}/>
<div className="orb-3 absolute" style={{
bottom: '20%', left: '40%',
width: 250, height: 250,
borderRadius: '50%',
background: 'radial-gradient(circle, rgba(212,114,42,0.14) 0%, transparent 70%)',
filter: 'blur(35px)',
}}/>
<div className="orb-1 absolute" style={{
top: '35%', right: '25%',
width: 180, height: 180,
borderRadius: '50%',
background: 'radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%)',
filter: 'blur(25px)',
animationDelay: '-4s',
}}/>
</div>
);
}

// ─── LIGHT STREAKS ────────────────────────────────────────────────────────────
function LightStreaks() {
const streaks = [
{ top: '20%', delay: '0s', duration: '8s' },
{ top: '45%', delay: '3s', duration: '12s' },
{ top: '70%', delay: '6s', duration: '9s' },
];
return (
<div className="absolute inset-0 overflow-hidden pointer-events-none">
{streaks.map((s, i) => (
<div key={i} className="light-streak" style={{
top: s.top,
animationDelay: s.delay,
animationDuration: s.duration,
width: `${150 + i * 80}px`,
}}/>
))}
</div>
);
}

// ─── ANIMATED BACKGROUND ──────────────────────────────────────────────────────
function AnimatedBackground({ images, currentIdx }) {
return (
<div className="absolute inset-0">
{images.map((img, i) => (
<div
key={i}
className={`bg-image ${['ken-burns-1','ken-burns-2','ken-burns-3'][i % 3]}`}
style={{
backgroundImage: `url(${img})`,
opacity: i === currentIdx ? 1 : 0,
animationDelay: `${i * -4}s`,
}}
/>
))}
{/* Gradient overlays */}
<div style={{
position: 'absolute', inset: 0,
background: 'linear-gradient(to bottom, rgba(10,6,8,0.7) 0%, rgba(10,6,8,0.4) 40%, rgba(10,6,8,0.85) 100%)',
}}/>
<div style={{
position: 'absolute', inset: 0,
background: 'linear-gradient(135deg, rgba(139,26,26,0.15) 0%, transparent 60%)',
}}/>
<FloatingOrbs />
<LightStreaks />
<Particles />
</div>
);
}

// ─── NAVIGATION ───────────────────────────────────────────────────────────────
function Navbar({ scrollY }) {
const [scrolled, setScrolled] = useState(false);
const [mobileOpen, setMobileOpen] = useState(false);

useEffect(() => {
const unsub = scrollY.onChange(v => setScrolled(v > 60));
return unsub;
}, [scrollY]);

const links = ['Discover', 'Archive', 'Community', 'AI Assist', 'Contributors'];

return (
<motion.nav
initial={{ y: -80, opacity: 0 }}
animate={{ y: 0, opacity: 1 }}
transition={{ duration: 0.8, ease: [0.4,0,0.2,1] }}
style={{
position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
padding: scrolled ? '12px 32px' : '20px 32px',
transition: 'all 0.4s',
background: scrolled ? 'rgba(10,6,8,0.85)' : 'transparent',
backdropFilter: scrolled ? 'blur(20px)' : 'none',
borderBottom: scrolled ? '1px solid rgba(201,168,76,0.1)' : 'none',
}}
>
<div style={{ maxWidth: 1200, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
{/* Logo */}
<div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
<div style={{
width: 32, height: 32, borderRadius: '50%',
background: 'linear-gradient(135deg, #c9a84c, #8b1a1a)',
display: 'flex', alignItems: 'center', justifyContent: 'center',
fontSize: 14, fontWeight: 700, color: '#fff',
}}>K</div>
<span style={{ fontFamily: 'Playfair Display', fontWeight: 700, fontSize: 18, color: '#c9a84c' }}>KalaSetu</span>
</div>

{/* Desktop links */}
<div style={{ display: 'flex', gap: 32 }} className="hidden md:flex">
{links.map(l => (
<a key={l} href={`#${l.toLowerCase().replace(' ','-')}`}
className="nav-link"
style={{ fontSize: 13, color: 'rgba(240,230,211,0.7)', fontWeight: 500, letterSpacing: '0.02em', textDecoration: 'none' }}
>{l}</a>
))}
</div>

{/* CTA */}
<div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
<a href="signup.html">Join KalaSetu </a>
< a href = "login.html" >Already a user? Login</a>
</div>
</div>
</motion.nav>
);
}

// ─── HERO ─────────────────────────────────────────────────────────────────────
function HeroSection() {
const [bgIdx, setBgIdx] = useState(0);
const heroImages = [IMG.hero, IMG.carving, IMG.temple];

useEffect(() => {
const t = setInterval(() => {
setBgIdx(i => (i + 1) % heroImages.length);
}, 6000);
return () => clearInterval(t);
}, []);

const stats = [
{ label: 'Active Projects', value: '1,247', icon: '🗂' },
{ label: 'Contributors', value: '8,432', icon: '👥' },
{ label: 'Items Preserved', value: '24,891', icon: '🗄' },
];

return (
<section style={{ position: 'relative', minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden' }}>
<AnimatedBackground images={heroImages} currentIdx={bgIdx} />

{/* Content */}
<div style={{ position: 'relative', zIndex: 10, textAlign: 'center', padding: '0 24px', maxWidth: 900, margin: '0 auto' }}>
{/* Badge */}
<motion.div
initial={{ opacity: 0, y: 20 }}
animate={{ opacity: 1, y: 0 }}
transition={{ delay: 0.3, duration: 0.7 }}
style={{ display: 'inline-flex', alignItems: 'center', gap: 8, marginBottom: 32 }}
>
<div style={{
padding: '6px 18px', borderRadius: 999,
background: 'rgba(201,168,76,0.12)',
border: '1px solid rgba(201,168,76,0.3)',
fontSize: 12, fontWeight: 600, color: '#c9a84c',
letterSpacing: '0.1em', textTransform: 'uppercase',
}}>
✦ Preserving Heritage Through Innovation
</div>
</motion.div>

{/* Main title */}
<motion.div
initial={{ opacity: 0, y: 40, scale: 0.94 }}
animate={{ opacity: 1, y: 0, scale: 1 }}
transition={{ delay: 0.5, duration: 1, ease: [0.4,0,0.2,1] }}
>
<h1 style={{
fontFamily: 'Playfair Display',
fontSize: 'clamp(72px, 14vw, 140px)',
fontWeight: 900,
lineHeight: 0.9,
marginBottom: 4,
}} className="glow-text glow-gold">
KalaSetu
</h1>
<div style={{
width: '60%', height: 2, margin: '16px auto 24px',
background: 'linear-gradient(90deg, transparent, #c9a84c, transparent)',
}}/>
</motion.div>

{/* Subtitle */}
<motion.p
initial={{ opacity: 0, y: 20 }}
animate={{ opacity: 1, y: 0 }}
transition={{ delay: 0.8, duration: 0.8 }}
style={{
fontSize: 'clamp(15px, 2.2vw, 20px)',
color: 'rgba(240,230,211,0.75)',
fontWeight: 300,
lineHeight: 1.7,
maxWidth: 640,
margin: '0 auto 40px',
letterSpacing: '0.01em',
}}
>
A unified platform bridging artists, historians, archivists & technologists
to <em style={{ color: '#c9a84c', fontStyle: 'normal' }}>preserve, digitize & celebrate</em> India's timeless heritage.
</motion.p>

{/* CTAs */}
<motion.div
initial={{ opacity: 0, y: 20 }}
animate={{ opacity: 1, y: 0 }}
transition={{ delay: 1.0, duration: 0.7 }}
style={{ display: 'flex', gap: 16, justifyContent: 'center', flexWrap: 'wrap', marginBottom: 64 }}
>
<motion.button whileHover={{ scale: 1.05, boxShadow: '0 0 40px rgba(201,168,76,0.4)' }} whileTap={{ scale: 0.97 }}
style={{
padding: '14px 36px', borderRadius: 999,
background: 'linear-gradient(135deg, #c9a84c 0%, #d4722a 100%)',
border: 'none', color: '#fff', fontSize: 15, fontWeight: 700,
cursor: 'none', letterSpacing: '0.03em',
}}>
Explore Archive ↗
</motion.button>
<motion.button whileHover={{ scale: 1.05 }} whileTap={{ scale: 0.97 }}
style={{
padding: '14px 36px', borderRadius: 999,
background: 'rgba(201,168,76,0.08)',
border: '1px solid rgba(201,168,76,0.35)',
color: '#c9a84c', fontSize: 15, fontWeight: 600,
cursor: 'none', backdropFilter: 'blur(10px)',
}}>
Join as Contributor
</motion.button>
</motion.div>

{/* Stats */}
<motion.div
initial={{ opacity: 0, y: 30 }}
animate={{ opacity: 1, y: 0 }}
transition={{ delay: 1.2, duration: 0.8 }}
style={{ display: 'flex', gap: 24, justifyContent: 'center', flexWrap: 'wrap' }}
>
{stats.map((s, i) => (
<div key={i} className="glass" style={{
padding: '16px 28px', borderRadius: 16,
textAlign: 'center', minWidth: 130,
}}>
<div style={{ fontSize: 22, marginBottom: 4 }}>{s.icon}</div>
<div style={{ fontSize: 22, fontWeight: 800, color: '#c9a84c', fontFamily: 'Playfair Display' }}>{s.value}</div>
<div style={{ fontSize: 11, color: 'rgba(240,230,211,0.5)', letterSpacing: '0.06em', textTransform: 'uppercase', marginTop: 2 }}>{s.label}</div>
</div>
))}
</motion.div>

{/* Scroll indicator */}
<motion.div
initial={{ opacity: 0 }}
animate={{ opacity: 1 }}
transition={{ delay: 2, duration: 1 }}
style={{ marginTop: 60, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}
>
<div style={{ fontSize: 11, color: 'rgba(240,230,211,0.4)', letterSpacing: '0.15em', textTransform: 'uppercase' }}>Scroll to discover</div>
<motion.div
animate={{ y: [0, 8, 0] }}
transition={{ duration: 1.5, repeat: Infinity }}
style={{ width: 1, height: 40, background: 'linear-gradient(to bottom, rgba(201,168,76,0.6), transparent)' }}
/>
</motion.div>
</div>
</section>
);
}

// ─── FEATURE SECTION ──────────────────────────────────────────────────────────
function RevealBlock({ children, delay = 0 }) {
const ref = useRef(null);
const inView = useInView(ref, { once: true, margin: '-80px' });
